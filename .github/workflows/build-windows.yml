name: Build Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: no `cache: yarn` here. setup-node's yarn caching invokes `yarn`
      # internally, which hits the runner's preinstalled Yarn 1.22.22 and errors
      # on the declared packageManager field. Deployments install fast enough.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Print toolchain versions
        shell: pwsh
        run: |
          node --version
          corepack --version
          corepack yarn --version
          where.exe yarn

      # Invoke yarn through corepack explicitly: the runner has a global
      # Yarn 1.22.22 that shadows corepack shims on PATH, so a bare `yarn`
      # errors on the packageManager field.
      - name: Install JavaScript dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack yarn install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows amd64 installer
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack yarn tauri build --target x86_64-pc-windows-msvc

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bs2proctlgui-windows-amd64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
