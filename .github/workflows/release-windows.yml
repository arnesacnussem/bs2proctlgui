name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: yarn`: setup-node's yarn cache invokes `yarn` internally,
      # which hits the runner's preinstalled Yarn 1.22.22 and errors on the
      # declared packageManager field.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack yarn install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BS2 Pro ${{ github.ref_name }}
          releaseBody: Windows amd64 installer for BS2 Pro.
          releaseDraft: false
          prerelease: false
          tauriScript: corepack yarn
          args: --target x86_64-pc-windows-msvc
